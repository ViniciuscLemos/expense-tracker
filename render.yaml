# Render config (Blueprint): the page and the API in one Docker service on the free plan.
# The database is a free Neon Postgres (Render's free one is deleted after 30 days).
services:
  - type: web
    name: expense-tracker
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/health
    envVars:
      # the public demo: Marina's six months, made again on every start
      - key: DEMO
        value: "true"
      # the connection of the link shortener (same Neon project), with its own database:
      # nobody has to copy the password. Without the trail service, paste DATABASE_URL instead.
      - key: DATABASE_URL
        fromService:
          type: web
          name: trail
          envVarKey: DATABASE_URL
      - key: DATABASE_NAME
        value: expenses
